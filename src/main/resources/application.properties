# Datasource local: forneça estes valores na configuração do IntelliJ ou no ambiente WSL.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway usa uma conexão de migração separada da conta de runtime.
spring.flyway.enabled=true
spring.flyway.url=${SPRING_FLYWAY_URL}
spring.flyway.user=${SPRING_FLYWAY_USER}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD}
# Placeholder não secreto: apenas o pipeline/provisionador aprovado pode afirmar
# que o destino é uma instalação nova. Default falso => nunca inferir novidade.
spring.flyway.placeholders.h04InitialInstall=${H04_INITIAL_INSTALL:false}

# Flyway é a única autoridade de criação/evolução do schema.
spring.jpa.hibernate.ddl-auto=validate

# Obrigatório para criar o contexto de autenticação. A chave não deve ser versionada.
jwt.secret=${JWT_SECRET}
# Em milissegundos, conforme JwtService.generateToken.
jwt.expiration=${JWT_EXPIRATION_MS}
