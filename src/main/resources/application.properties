# Datasource local: forneça estes valores na configuração do IntelliJ ou no ambiente WSL.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Flyway é a única autoridade de criação/evolução do schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Obrigatório para criar o contexto de autenticação. A chave não deve ser versionada.
jwt.secret=${JWT_SECRET}
# Em milissegundos, conforme JwtService.generateToken.
jwt.expiration=${JWT_EXPIRATION_MS}
