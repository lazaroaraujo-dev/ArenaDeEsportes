# Configuração mínima para o modo CLI offline (AdminCliApplication).
# Sobrescreve application.properties, evitando que placeholders de ambiente
# da aplicação web causem falha na inicialização.

spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,\
  org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=

spring.flyway.enabled=false
spring.flyway.url=
spring.flyway.user=
spring.flyway.password=

spring.jpa.hibernate.ddl-auto=none

jwt.secret=dummy-secret-not-used-in-cli
jwt.expiration=3600000

spring.main.web-application-type=none
spring.main.banner-mode=off
